<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🐍 Snake Game Of Pascal👻🎮 
                       <p></p>😎 </h1>
        <div class="score">Score : <span id="score">0</span></div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <div class="dpad">
                <button id="btnUp" class="ctrl-btn">▲</button>
                <div class="dpad-row">
                    <button id="btnLeft" class="ctrl-btn">◀</button>
                    <button id="btnRight" class="ctrl-btn">▶</button>
                </div>
                <button id="btnDown" class="ctrl-btn">▼</button>
            </div>
            <div class="speed-control">
                <label for="speedRange">Vitesse : <span id="speedValue">100</span>ms</label>
                <input type="range" id="speedRange" min="40" max="200" value="100" step="10">
            </div>
            <div class="pause-restart">
                <button id="pauseBtn">⏸️ Pause</button>
                <button id="restart">🔄 Nouvelle partie</button>
            </div>
        </div>
        <p class="instructions">Utilisez les flèches du clavier ou les boutons ci-dessus.</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
